name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm Trusted Publishing（OIDC）与 provenance 需要

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing 需要 npm CLI >= 11.5.1
      - name: Ensure recent npm
        run: npm install -g npm@latest && npm --version

      - name: Verify tag matches package version
        run: |
          node -e "const v=require('./package.json').version; const t=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(v!==t){console.error('tag',t,'!= package.json',v);process.exit(1)}"

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

      # 通过 OIDC Trusted Publishing 发布（无需 NODE_AUTH_TOKEN）
      - name: Publish
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
